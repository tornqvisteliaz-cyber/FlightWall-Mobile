<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlightWall • LED</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=VT323&amp;display=swap');
        
        .led-font {
            font-family: 'VT323', monospace;
            text-shadow: 
                0 0 5px #00ff9f,
                0 0 10px #00ff9f;
            letter-spacing: 3px;
        }

        .led-board {
            background-color: #0a0a0a;
            border: 3px solid #00ff9f;
            box-shadow: 
                0 0 15px rgba(0, 255, 159, 0.3),
                inset 0 0 20px rgba(0, 0, 0, 0.8);
        }

        .led-text {
            color: #00ff9f;
            text-shadow: 0 0 8px #00ff9f;
        }

        .airport-display {
            font-size: 3.5rem;
            line-height: 1;
            font-weight: 900;
            letter-spacing: 6px;
        }

        .data-value {
            font-size: 1.75rem;
            font-weight: 700;
            color: #00ff9f;
        }

        .led-glow {
            animation: led-flicker 1.5s infinite alternate;
        }

        .flight-board {
            background: #111;
            border: 2px solid #333;
        }
    </style>
</head>
<body class="bg-black text-[#00ff9f] font-mono">
    <div class="max-w-2xl mx-auto min-h-screen p-4">
        
        <!-- Header -->
        <div class="flex items-center justify-between mb-6 pt-4">
            <div class="flex items-center gap-x-3">
                <!-- Heart Logo -->
                <div class="w-12 h-12 rounded-full bg-gradient-to-br from-[#0033A0] to-[#FF0000] flex items-center justify-center shadow-lg">
                    <i class="fas fa-heart text-white text-3xl"></i>
                </div>
                <div>
                    <div class="text-2xl font-bold tracking-[4px]">FLIGHTWALL</div>
                    <div class="text-xs text-[#00ff9f]/60 -mt-1">LED EDITION</div>
                </div>
            </div>
            
            <div class="px-3 py-1 bg-[#00ff9f]/10 border border-[#00ff9f]/30 rounded text-xs tracking-widest">
                LIVE
            </div>
        </div>

        <!-- Search -->
        <div class="mb-8">
            <div class="flex gap-2">
                <input 
                    id="flight-input"
                    type="text" 
                    placeholder="FLIGHT NUMBER (t.ex. SK142)"
                    class="flex-1 bg-[#111] border border-[#00ff9f]/40 text-[#00ff9f] px-6 py-4 text-xl rounded-none focus:outline-none focus:border-[#00ff9f] placeholder:text-[#00ff9f]/40"
                    onkeypress="if (event.key === 'Enter') searchFlight()"
                >
                <button 
                    onclick="searchFlight()"
                    class="px-8 bg-[#00ff9f] text-black font-bold text-lg tracking-wider hover:bg-white transition-colors">
                    SÖK
                </button>
            </div>
            <div class="text-center mt-2 text-xs text-[#00ff9f]/50">Exempel: SK142 • BA117 • LH456</div>
        </div>

        <!-- LED Flight Board -->
        <div id="flight-board" class="hidden">
            <div class="led-board p-6 rounded">
                
                <!-- Top row: Airline + Status -->
                <div class="flex justify-between items-start mb-4">
                    <div>
                        <div id="airline-name" class="text-2xl font-bold tracking-wider"></div>
                        <div id="callsign" class="text-4xl font-black led-text"></div>
                    </div>
                    
                    <div class="text-right">
                        <div class="inline-flex items-center gap-x-2 px-4 py-1 bg-black border border-[#00ff9f]/40">
                            <div class="w-2 h-2 bg-[#00ff9f] rounded-full animate-pulse"></div>
                            <span id="status" class="font-bold tracking-[3px] text-sm"></span>
                        </div>
                    </div>
                </div>

                <!-- Big Route -->
                <div class="mb-1">
                    <div id="route-code" class="airport-display led-text"></div>
                </div>

                <!-- Aircraft -->
                <div class="flex items-baseline gap-x-3 mb-6">
                    <div id="aircraft-type" class="text-2xl font-bold"></div>
                    <div id="registration" class="text-xl opacity-70"></div>
                </div>

                <!-- Airports -->
                <div class="grid grid-cols-2 gap-4 mb-8">
                    <div>
                        <div class="text-xs tracking-widest opacity-60 mb-1">FROM</div>
                        <div id="origin-name" class="text-2xl font-bold leading-none"></div>
                        <div id="origin-code" class="text-4xl font-black led-text"></div>
                    </div>
                    <div class="text-right">
                        <div class="text-xs tracking-widest opacity-60 mb-1">TO</div>
                        <div id="dest-name" class="text-2xl font-bold leading-none"></div>
                        <div id="dest-code" class="text-4xl font-black led-text"></div>
                    </div>
                </div>

                <!-- Live Data -->
                <div class="bg-black border border-[#00ff9f]/30 p-5">
                    <div class="grid grid-cols-4 gap-4 text-center">
                        
                        <div>
                            <div class="text-xs tracking-[2px] opacity-60">ALT</div>
                            <div id="altitude" class="data-value"></div>
                        </div>
                        <div>
                            <div class="text-xs tracking-[2px] opacity-60">SPD</div>
                            <div id="speed" class="data-value"></div>
                        </div>
                        <div>
                            <div class="text-xs tracking-[2px] opacity-60">TRK</div>
                            <div id="heading" class="data-value"></div>
                        </div>
                        <div>
                            <div class="text-xs tracking-[2px] opacity-60">VR</div>
                            <div id="vertical-rate" class="data-value"></div>
                        </div>
                    </div>
                </div>

            </div>

            <!-- Footer actions -->
            <div class="flex justify-center gap-3 mt-4">
                <button onclick="shareFlight()" 
                        class="flex-1 py-3 border border-[#00ff9f]/60 hover:bg-[#00ff9f]/10 transition-colors text-sm tracking-widest">
                    <i class="fas fa-share mr-2"></i> DELA FLYGNING
                </button>
                <button onclick="refreshData()" 
                        class="flex-1 py-3 border border-[#00ff9f]/60 hover:bg-[#00ff9f]/10 transition-colors text-sm tracking-widest">
                    <i class="fas fa-sync mr-2"></i> UPPDATERA
                </button>
            </div>
        </div>

        <!-- Empty state -->
        <div id="empty-state" class="text-center py-12">
            <i class="fas fa-plane text-6xl opacity-20 mb-4"></i>
            <p class="text-xl opacity-60">Ange ett flightnummer ovan</p>
            <p class="text-sm opacity-40 mt-1">Ex: SK142, BA117 eller LH456</p>
        </div>

    </div>

    <script>
        // Mock flight data
        const mockFlights = {
            'SK142': {
                flightNumber: 'SK142',
                callsign: 'SAS142',
                airline: 'Scandinavian Airlines',
                aircraftType: 'A320neo',
                registration: 'SE-ROE',
                origin: 'ARN',
                originName: 'Stockholm Arlanda',
                destination: 'LHR',
                destName: 'London Heathrow',
                altitude: 11200,
                speed: 845,
                heading: 245,
                verticalRate: 0,
                status: 'CRUISING',
                progress: 0.72
            },
            'BA117': {
                flightNumber: 'BA117',
                callsign: 'BAW117',
                airline: 'British Airways',
                aircraftType: 'A321',
                registration: 'G-EUXL',
                origin: 'LHR',
                originName: 'London Heathrow',
                destination: 'JFK',
                destName: 'New York JFK',
                altitude: 4500,
                speed: 420,
                heading: 270,
                verticalRate: 12,
                status: 'CLIMBING',
                progress: 0.15
            },
            'LH456': {
                flightNumber: 'LH456',
                callsign: 'DLH456',
                airline: 'Lufthansa',
                aircraftType: 'A340-300',
                registration: 'D-AIGX',
                origin: 'FRA',
                originName: 'Frankfurt',
                destination: 'SIN',
                destName: 'Singapore',
                altitude: 9800,
                speed: 780,
                heading: 90,
                verticalRate: 8,
                status: 'CLIMBING',
                progress: 0.08
            }
        };

        let currentFlight = null;

        function searchFlight() {
            const input = document.getElementById('flight-input').value.trim().toUpperCase();
            
            if (!input) return;

            const flight = mockFlights[input];
            
            if (flight) {
                currentFlight = flight;
                showFlightBoard(flight);
            } else {
                alert('Flight hittades inte. Testa SK142, BA117 eller LH456');
            }
        }

        function showFlightBoard(flight) {
            document.getElementById('empty-state').classList.add('hidden');
            document.getElementById('flight-board').classList.remove('hidden');

            document.getElementById('airline-name').textContent = flight.airline;
            document.getElementById('callsign').textContent = flight.callsign;
            document.getElementById('route-code').textContent = `${flight.origin}-${flight.destination}`;
            document.getElementById('aircraft-type').textContent = flight.aircraftType;
            document.getElementById('registration').textContent = flight.registration;
            document.getElementById('origin-name').textContent = flight.originName;
            document.getElementById('origin-code').textContent = flight.origin;
            document.getElementById('dest-name').textContent = flight.destName;
            document.getElementById('dest-code').textContent = flight.destination;
            document.getElementById('status').textContent = flight.status;

            document.getElementById('altitude').textContent = `${(flight.altitude / 1000).toFixed(1)} km`;
            document.getElementById('speed').textContent = `${flight.speed} km/h`;
            document.getElementById('heading').textContent = `${flight.heading}°`;
            document.getElementById('vertical-rate').textContent = `+${flight.verticalRate} m/s`;
        }

        function refreshData() {
            if (!currentFlight) return;
            currentFlight.altitude = currentFlight.altitude + (Math.random() * 40 - 20);
            currentFlight.speed = currentFlight.speed + (Math.random() * 6 - 3);
            showFlightBoard(currentFlight);
        }

        function shareFlight() {
            if (!currentFlight) return;
            const text = `Följ ${currentFlight.flightNumber} ${currentFlight.origin}-${currentFlight.destination} live på FlightWall LED`;
            
            if (navigator.share) {
                navigator.share({ text });
            } else {
                navigator.clipboard.writeText(text).then(() => {
                    alert('Kopierat till urklipp!');
                });
            }
        }

        document.getElementById('flight-input').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                searchFlight();
            }
        });

        // Auto demo
        setTimeout(() => {
            const input = document.getElementById('flight-input');
            if (input && !currentFlight) {
                input.value = 'SK142';
                searchFlight();
            }
        }, 1500);
    </script>
</body>
</html>
